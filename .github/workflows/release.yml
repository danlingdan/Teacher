name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify tag matches Maven version
        shell: pwsh
        run: |
          [xml]$pom = Get-Content -LiteralPath pom.xml -Raw
          $version = [string]$pom.project.version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not match pom.xml version '$version'."
          }
          "PROJECT_VERSION=$version" >> $env:GITHUB_ENV
          if ($version -match '-(?<channel>alpha|beta|rc)\.[0-9]+$') {
              "RELEASE_CHANNEL=$($Matches.channel)" >> $env:GITHUB_ENV
              "RELEASE_PRERELEASE=true" >> $env:GITHUB_ENV
          } else {
              "RELEASE_CHANNEL=stable" >> $env:GITHUB_ENV
              "RELEASE_PRERELEASE=false" >> $env:GITHUB_ENV
          }

      - name: Run full test suite
        run: mvn -B test

      - name: Build Windows installer and portable archive
        shell: pwsh
        run: .\packaging\package-stage1.ps1

      - name: Verify release artifacts and cloud endpoint
        shell: pwsh
        run: |
          $installer = "target/installer/SQLTeacher-$env:PROJECT_VERSION.exe"
          $archive = "target/installer/SQLTeacher-$env:PROJECT_VERSION-windows-x64.zip"
          $checksums = "target/installer/SHA256SUMS.txt"
          $sbom = "target/installer/sqlteacher-sbom.json"
          $config = "target/installer/SQLTeacher/app/SQLTeacher.cfg"
          foreach ($file in @($installer, $archive, $checksums, $sbom, $config)) {
              if (-not (Test-Path -LiteralPath $file)) { throw "Missing release artifact: $file" }
          }
          if (-not (Select-String -LiteralPath $config -SimpleMatch '-Dsqlteacher.cloud.base-url=https://api.sqlteacher.tech' -Quiet)) {
              throw 'Packaged launcher does not contain the production cloud API URL.'
          }

      - name: Create signed stable update manifest
        shell: pwsh
        env:
          SQLTEACHER_UPDATE_SIGNING_KEY: ${{ secrets.SQLTEACHER_UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SQLTEACHER_UPDATE_SIGNING_KEY)) { throw 'Release signing key is not configured.' }
          $installer = Get-Item -LiteralPath "target/installer/SQLTeacher-$env:PROJECT_VERSION.exe"
          $archive = Get-Item -LiteralPath "target/installer/SQLTeacher-$env:PROJECT_VERSION-windows-x64.zip"
          $payload = [ordered]@{
              schemaVersion = 1; product = 'SQLTeacher'; channel = $env:RELEASE_CHANNEL; version = $env:PROJECT_VERSION
              platform = 'windows'; architecture = 'x64'; publishedAt = [DateTimeOffset]::UtcNow.ToString('o')
              releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/$env:GITHUB_REF_NAME"
              installerUrl = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/$($installer.Name)"
              installerSize = $installer.Length; installerSha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              portableUrl = "https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/$($archive.Name)"
              portableSize = $archive.Length; portableSha256 = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              minimumSupportedVersion = '1.9.0'
              rollout = @{ percentage = 100; paused = $false }
          }
          $payload | ConvertTo-Json -Compress | Set-Content -LiteralPath target/installer/update-payload.json -Encoding utf8
          java packaging/UpdateManifestTool.java sign target/installer/update-payload.json target/installer/update-manifest.json release-2026-01
          if ($LASTEXITCODE -ne 0) { throw 'Unable to sign update manifest.' }

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SQLTeacher-${{ env.PROJECT_VERSION }}-windows
          path: |
            target/installer/SQLTeacher-${{ env.PROJECT_VERSION }}.exe
            target/installer/SQLTeacher-${{ env.PROJECT_VERSION }}-windows-x64.zip
            target/installer/SHA256SUMS.txt
            target/installer/sqlteacher-sbom.json
            target/installer/update-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create release draft when needed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
              if ($env:RELEASE_PRERELEASE -eq 'true') {
                  gh release create $env:GITHUB_REF_NAME --verify-tag --draft --prerelease `
                      --title "SQLTeacher $env:GITHUB_REF_NAME" --generate-notes
              } else {
                  gh release create $env:GITHUB_REF_NAME --verify-tag --draft `
                      --title "SQLTeacher $env:GITHUB_REF_NAME" --generate-notes
              }
              if ($LASTEXITCODE -ne 0) { throw 'Unable to create the GitHub Release draft.' }
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:GITHUB_REF_NAME `
              "target/installer/SQLTeacher-$env:PROJECT_VERSION.exe" `
              "target/installer/SQLTeacher-$env:PROJECT_VERSION-windows-x64.zip" `
              "target/installer/SHA256SUMS.txt" `
              "target/installer/sqlteacher-sbom.json" `
              "target/installer/update-manifest.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload GitHub Release assets.' }

      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_PRERELEASE -eq 'true') {
              gh release edit $env:GITHUB_REF_NAME --draft=false --prerelease --latest=false
          } else {
              gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the GitHub Release.' }
